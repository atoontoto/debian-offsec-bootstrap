# shellcheck shell=bash
: "${OFFSEC_PROFILE:=standard}"
: "${OFFSEC_DESKTOP:=none}"
: "${OFFSEC_INSTALL_BURP:=true}"
: "${OFFSEC_INSTALL_BLOODHOUND:=true}"
: "${OFFSEC_INSTALL_WORDLISTS:=true}"
: "${OFFSEC_INSTALL_WIRELESS:=false}"
: "${OFFSEC_INSTALL_CLOUD:=true}"
: "${OFFSEC_UPDATE_CHANNEL:=stable}"
: "${OFFSEC_ALLOW_DOCKER_GROUP:=false}"
: "${OFFSEC_AUTO_START_SERVICES:=false}"
: "${OFFSEC_INSTALL_ROOT:=/opt/offsec}"
: "${OFFSEC_WORDLIST_ROOT:=/usr/share/wordlists}"
: "${OFFSEC_LOG_ROOT:=/var/log/debian-offsec-bootstrap}"
: "${OFFSEC_STATE_ROOT:=/var/lib/debian-offsec-bootstrap}"
: "${OFFSEC_SAFE_UPGRADE:=true}"
: "${OFFSEC_MIN_FREE_GIB:=5}"
: "${OFFSEC_GDB_PLUGIN:=gef}"
: "${OFFSEC_BURP_DOWNLOAD_URL:=}"
: "${OFFSEC_BURP_SHA256:=}"
: "${OFFSEC_METASPLOIT_INSTALLER:=manual}"
: "${OFFSEC_WIRESHARK_CAPTURE_GROUP:=false}"
