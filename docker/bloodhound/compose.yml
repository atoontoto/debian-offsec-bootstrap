name: offsec-bloodhound
services:
  app-db:
    image: docker.io/library/postgres:16.6-alpine@sha256:1d04b9ba1d4996401f2552b51beda8187f175c0645c091e4781134fc9c9a3eef
    restart: "no"
    environment:
      POSTGRES_USER: bloodhound
      POSTGRES_DB: bloodhound
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    volumes:
      - app-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bloodhound -d bloodhound"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true

  graph-db:
    image: docker.io/library/neo4j:4.4.42@sha256:73b5a47eb9952f47fcc42fcc80bdd6bd0d6b71eea9a1a345c216675498c790e4
    restart: "no"
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?set in .env}
      NEO4J_dbms_connector_bolt_listen__address: :7687
      NEO4J_dbms_connector_http_listen__address: :7474
    volumes:
      - graph-db-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:7474/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
    security_opt:
      - no-new-privileges:true

  bloodhound:
    image: docker.io/specterops/bloodhound:9.1.0@sha256:0afafb9de0cfd36f233a4952d82dde56ed50f31167a5c588419446414f83ddd0
    restart: "no"
    depends_on:
      app-db:
        condition: service_healthy
      graph-db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      bhe_database_connection: user=bloodhound password=${POSTGRES_PASSWORD:?set in .env} dbname=bloodhound host=app-db
      bhe_graph_driver: neo4j
      bhe_neo4j_connection: neo4j://neo4j:${NEO4J_PASSWORD:?set in .env}@graph-db:7687/
      bhe_default_admin_principal_name: admin
      bhe_default_admin_password: ${BHE_ADMIN_PASSWORD:?set in .env}
      bhe_recreate_default_admin: ${BHE_RECREATE_DEFAULT_ADMIN:-false}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/api/version || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
    security_opt:
      - no-new-privileges:true

volumes:
  app-db-data:
  graph-db-data:
